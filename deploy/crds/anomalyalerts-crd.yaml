apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: anomalyalerts.mist.io
spec:
  group: mist.io
  names:
    kind: AnomalyAlert
    plural: anomalyalerts
    singular: anomalyalert
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for AnomalyAlertSpec via `CustomResource`
        properties:
          spec:
            description: |-
              An analyzer finding mirrored into the cluster. Created and updated by the
              operator's alert webhook; deduplicated by [`AnomalyAlertSpec::alert_id`].
            properties:
              alertId:
                description: Stable dedupe id from the analyzer (e.g. `scan:10.0.1.4`).
                type: string
              attributes:
                additionalProperties:
                  type: string
                default: {}
                description: Analyzer attributes (detector name, protocol, ...).
                type: object
              detail:
                type: string
              explanation:
                nullable: true
                type: string
              severity:
                enum:
                - info
                - warning
                - critical
                type: string
              title:
                type: string
              workloadName:
                nullable: true
                type: string
              workloadNamespace:
                nullable: true
                type: string
            required:
            - alertId
            - detail
            - severity
            - title
            type: object
          status:
            nullable: true
            properties:
              firstSeenUnixMs:
                format: int64
                type: integer
              lastSeenUnixMs:
                format: int64
                type: integer
              occurrences:
                format: int64
                type: integer
              state:
                enum:
                - Firing
                - Resolved
                type: string
            required:
            - firstSeenUnixMs
            - lastSeenUnixMs
            - occurrences
            - state
            type: object
        required:
        - spec
        title: AnomalyAlert
        type: object
    served: true
    storage: true
    subresources:
      status: {}

