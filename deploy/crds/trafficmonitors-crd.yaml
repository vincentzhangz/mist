apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trafficmonitors.mist.io
spec:
  group: mist.io
  names:
    kind: TrafficMonitor
    plural: trafficmonitors
    singular: trafficmonitor
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for TrafficMonitorSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Desired state of mist traffic monitoring. The operator renders the agent
              `DaemonSet` from the oldest instance in its namespace; any additional
              instances are marked `Superseded` in status.
            properties:
              agentImage:
                default: mist-agent:dev
                description: Agent container image.
                type: string
              apiTokenSecretName:
                description: |-
                  Name of a Secret holding the agent ingest token (key
                  `ingest-token`, same Secret/key the API reads `INGEST_TOKEN` from).
                  When set, the agent container gets `MIST_API_TOKEN` from it and
                  authenticates `POST /api/ingest`; when unset, agents send no token.
                nullable: true
                type: string
              apiUrl:
                default: http://mist-api.mist.svc.cluster.local:3000
                description: Base URL agents ship flow batches to.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                default: {}
                description: '`DaemonSet` node selector; empty schedules on all nodes.'
                type: object
              objectPath:
                default: /etc/mist/mist-ebpf.o
                description: eBPF object path inside the agent image.
                type: string
              sampleIntervalSecs:
                default: 5
                description: Agent drain interval in seconds.
                format: uint64
                minimum: 0.0
                type: integer
              watchedNamespaces:
                default: []
                description: |-
                  Namespaces to monitor; empty means all. Recorded for the agent
                  (agent-side filtering lands with the analyzer).
                items:
                  type: string
                type: array
            type: object
          status:
            nullable: true
            properties:
              message:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              state:
                enum:
                - Pending
                - Ready
                - Superseded
                type: string
            required:
            - state
            type: object
        required:
        - spec
        title: TrafficMonitor
        type: object
    served: true
    storage: true
    subresources:
      status: {}

