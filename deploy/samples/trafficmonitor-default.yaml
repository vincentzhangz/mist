# Default TrafficMonitor: the operator renders the agent DaemonSet from this.
apiVersion: mist.io/v1
kind: TrafficMonitor
metadata:
  name: default
  namespace: mist
spec:
  watchedNamespaces: []
  sampleIntervalSecs: 5
  agentImage: mist-agent:dev
  nodeSelector: {}
  apiUrl: http://mist-api.mist.svc.cluster.local:3000
  objectPath: /etc/mist/mist-ebpf.o
  # Agents authenticate ingest from this Secret's `ingest-token` key (see
  # deploy/api-auth-secret.example). Omit for open ingest (dev only).
  apiTokenSecretName: mist-api-auth
