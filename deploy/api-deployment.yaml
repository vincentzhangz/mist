# mist-api Deployment + Service.
# Image is a placeholder until the container build lands (Phase 5);
# for local dev, run `cargo run -p mist-api` with DATABASE_URL pointed at
# a port-forwarded StatefulSet (see deploy/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mist-api
  namespace: mist
  labels:
    app.kubernetes.io/name: mist-api
    app.kubernetes.io/part-of: mist
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mist-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mist-api
        app.kubernetes.io/part-of: mist
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mist-api:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3000
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: mist-postgres
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mist-postgres
                  key: password
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@mist-postgres.mist.svc.cluster.local:5432/mist
            - name: OPERATOR_WEBHOOK_URL
              value: http://mist-operator.mist.svc.cluster.local:8081/alerts
            - name: BIND_ADDR
              value: 0.0.0.0:3000
            - name: RUST_LOG
              value: info
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mist-api
  namespace: mist
  labels:
    app.kubernetes.io/name: mist-api
    app.kubernetes.io/part-of: mist
spec:
  selector:
    app.kubernetes.io/name: mist-api
  ports:
    - port: 3000
      targetPort: 3000
