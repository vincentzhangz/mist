name: e2e-kind

# End-to-end smoke: builds all images from Dockerfiles, loads them into a
# fresh kind cluster, applies deploy/, and asserts the operator/API roll out
# and the operator renders the agent DaemonSet. Runs weekly plus on demand;
# not on every push (the release-mode container builds take several minutes).
#
# Known limits: the sensor's TC attach is NOT asserted (needs BTF on the
# runner kernel); the agent DaemonSet is checked for existence only.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0" # weekly, Sundays 06:00 UTC

env:
  # Hermetic toolchain install so parallel checkouts never share state.
  RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  kind-smoke:
    name: kind smoke (build, load, install, assert)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain with rust-src
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup --version >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          rustup toolchain install nightly --component rust-src
      - name: Install prebuilt bpf-linker
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          # Pinned to the release this repo was verified against.
          BPF_LINKER_VERSION=0.12.0
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          mkdir -p "$CARGO_HOME/bin" /tmp/bpf-linker
          curl -sSfL -o /tmp/bpf-linker/pkg.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          tar -I zstd -xf /tmp/bpf-linker/pkg.tar.zst -C /tmp/bpf-linker
          install -m755 "$(find /tmp/bpf-linker -name bpf-linker -type f | head -1)" "$CARGO_HOME/bin/bpf-linker"
          bpf-linker --version
      - name: Build eBPF object
        working-directory: crates/mist-ebpf
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          # Target + linker come from crates/mist-ebpf/.cargo/config.toml.
          # The linker emits `mist-ebpf` (no extension); the agent Dockerfile
          # expects it as mist-ebpf.o at the build context root.
          cargo +nightly build -Z build-std=core --release
          cp target/bpfel-unknown-none/release/mist-ebpf ../../mist-ebpf.o
      - name: Build dashboard bundle
        working-directory: crates/mist-dashboard
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          # The api Dockerfile COPYs dist/ into the image; same pinned
          # toolchain + trunk as the ci.yml dashboard job.
          rustup toolchain install 1.99.1
          rustup default 1.99.1
          rustup target add wasm32-unknown-unknown
          cargo install trunk --version 0.22.1 --locked
          trunk build --release
      - name: Build container images
        run: |
          # Tags must match deploy/*.yaml and the sample agentImage (:dev),
          # with imagePullPolicy IfNotPresent so kind-loaded images are used.
          docker build -t mist-api:dev -f docker/api.Dockerfile .
          docker build -t mist-operator:dev -f docker/operator.Dockerfile .
          docker build -t mist-agent:dev -f docker/agent.Dockerfile --build-arg EBPF_OBJECT=mist-ebpf.o .
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mist
      - name: Load images into kind
        run: kind load docker-image mist-api:dev mist-operator:dev mist-agent:dev --name mist
      - name: Apply manifests in install order
        run: |
          kubectl apply -f deploy/agent-rbac.yaml -f deploy/operator-rbac.yaml
          kubectl apply -f deploy/crds/
          kubectl apply -f deploy/postgres.yaml
          kubectl apply -f deploy/api-deployment.yaml -f deploy/operator-deployment.yaml
          kubectl apply -f deploy/samples/
      - name: Create API auth Secret
        run: |
          # The API pod blocks until this Secret exists (JWT_SECRET is a
          # required secretKeyRef) and refuses to start without it. Values
          # are e2e-only; see deploy/api-auth-secret.example for the shape.
          kubectl -n mist create secret generic mist-api-auth \
            --from-literal=jwt-secret=e2e-test-secret-not-for-production \
            --from-literal=admin-email=admin@example.com \
            --from-literal=admin-password='s3cret-for-kind' \
            --from-literal=ingest-token=e2e-ingest-token
      - name: Assert CRDs exist
        run: |
          kubectl wait --for=condition=Established crd/trafficmonitors.mist.io --timeout=60s
          kubectl wait --for=condition=Established crd/anomalyalerts.mist.io --timeout=60s
          kubectl get crd trafficmonitors.mist.io anomalyalerts.mist.io
      - name: Assert Postgres, operator, and API roll out
        run: |
          kubectl -n mist rollout status statefulset/mist-postgres --timeout=180s
          kubectl -n mist rollout status deployment/mist-operator --timeout=180s
          kubectl -n mist rollout status deployment/mist-api --timeout=180s
          kubectl -n mist get trafficmonitor default
      - name: Assert API serves the dashboard SPA
        run: |
          kubectl -n mist port-forward svc/mist-api 3100:3000 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3100/healthz >/dev/null && break
            sleep 2
          done
          # SPA shell at / and the client route /login, both referencing the
          # hashed trunk bundle; unknown /api/* paths stay JSON 404s.
          curl -sf http://127.0.0.1:3100/ | grep -q 'mist-dashboard-.*\.js'
          curl -sf http://127.0.0.1:3100/login | grep -q 'mist-dashboard-.*\.js'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/nope)" = "404"
          # Prometheus scrape is public and carries counters + storage gauges.
          curl -sf -D - http://127.0.0.1:3100/metrics -o /tmp/metrics.txt | grep -qi 'text/plain; version=0.0.4'
          grep -q 'mist_api_ingest_batches_accepted_total' /tmp/metrics.txt
          grep -q 'mist_api_flows_stored' /tmp/metrics.txt
          # Ingest requires the provisioned token; login issues JWTs for REST.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3100/api/ingest \
            -H 'content-type: application/json' -d '{"node":"probe","flows":[]}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3100/api/ingest \
            -H 'content-type: application/json' -H 'authorization: Bearer e2e-ingest-token' \
            -d '{"node":"probe","flows":[]}')" = "202"
          TOKEN=$(curl -sf -X POST http://127.0.0.1:3100/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"s3cret-for-kind"}' | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -sf -H "authorization: Bearer $TOKEN" http://127.0.0.1:3100/api/flows >/dev/null
      - name: Assert operator renders the agent DaemonSet
        run: |
          # Existence only: the sensor's TC attach needs BTF on the node.
          timeout 180 bash -c 'until kubectl -n mist get daemonset mist-agent >/dev/null 2>&1; do sleep 5; done'
