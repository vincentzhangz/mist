name: release

# Pushes :<tag> + :latest images to GHCR on version tags (v0.1.0, ...).
# Consumers then point deploy/*.yaml and chart values at the published
# tags instead of :dev. The eBPF object and dashboard bundle are built on
# the runner first (same steps as e2e-kind.yml) because the Dockerfiles
# COPY them in.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write # sigstore provenance via build-push-action defaults

env:
  RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  images:
    name: build + push mist images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain with rust-src
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup --version >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          rustup toolchain install nightly --component rust-src
      - name: Install prebuilt bpf-linker
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          BPF_LINKER_VERSION=0.12.0
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          mkdir -p "$CARGO_HOME/bin" /tmp/bpf-linker
          curl -sSfL -o /tmp/bpf-linker/pkg.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          tar -I zstd -xf /tmp/bpf-linker/pkg.tar.zst -C /tmp/bpf-linker
          install -m755 "$(find /tmp/bpf-linker -name bpf-linker -type f | head -1)" "$CARGO_HOME/bin/bpf-linker"
      - name: Build eBPF object
        working-directory: crates/mist-ebpf
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo +nightly build -Z build-std=core --release
          cp target/bpfel-unknown-none/release/mist-ebpf ../../mist-ebpf.o
      - name: Build dashboard bundle
        working-directory: crates/mist-dashboard
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install 1.99.1
          rustup default 1.99.1
          rustup target add wasm32-unknown-unknown
          cargo install trunk --version 0.22.1 --locked
          trunk build --release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner for GHCR
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build + push mist-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: >-
            ghcr.io/${{ steps.owner.outputs.name }}/mist-api:${{ github.ref_name }},
            ghcr.io/${{ steps.owner.outputs.name }}/mist-api:latest
      - name: Build + push mist-operator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/operator.Dockerfile
          push: true
          tags: >-
            ghcr.io/${{ steps.owner.outputs.name }}/mist-operator:${{ github.ref_name }},
            ghcr.io/${{ steps.owner.outputs.name }}/mist-operator:latest
      - name: Build + push mist-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          build-args: EBPF_OBJECT=mist-ebpf.o
          push: true
          tags: >-
            ghcr.io/${{ steps.owner.outputs.name }}/mist-agent:${{ github.ref_name }},
            ghcr.io/${{ steps.owner.outputs.name }}/mist-agent:latest
