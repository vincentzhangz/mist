[workspace]
resolver = "2"
members = [
    "crates/mist-agent",
    "crates/mist-api",
    "crates/mist-dashboard",
    "crates/mist-flow",
    "crates/mist-operator",
    "crates/mist-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
aya = "0.16"
clap = { version = "4", features = ["derive", "env"] }
console_error_panic_hook = "0.1"
futures = "0.3"
gloo-net = { version = "0.7", features = ["http", "websocket", "json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", features = ["runtime", "derive"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
mist-flow = { path = "crates/mist-flow" }
mist-types = { path = "crates/mist-types" }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
rustls = { version = "0.23", features = ["ring"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "json",
    "migrate",
    "macros",
] }
tokio-tungstenite = "0.30"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
