# Default values for the mist chart. Every value below maps to a field the
# underlying manifests already use — see deploy/*.yaml for the plain-manifest
# equivalents.

# Namespace for every namespaced object (also created by templates/namespace.yaml).
namespace: mist

agent:
  # The operator renders and owns the mist-agent DaemonSet from the
  # TrafficMonitor CR (field manager "mist-operator"). Leave this false so the
  # chart does not install a second DaemonSet that would fight the operator.
  # Set true ONLY for operator-less setups (bare-metal dev without the
  # controller); the operator will adopt/replace it once installed.
  enabled: false
  image: mist-agent:dev
  # Must match the DaemonSet the operator renders
  # (crates/mist-operator/testdata/agent-daemonset.yaml).
  hostNetwork: true
  privileged: true
  apiUrl: http://mist-api.mist.svc.cluster.local:3000
  intervalSecs: 5
  objectPath: /etc/mist/mist-ebpf.o
  # Secret holding the ingest token (key `ingest-token`), e.g. the
  # mist-api-auth Secret below. Empty sends no token (dev only).
  apiTokenSecretName: ""
  # Secret holding the agent mTLS identity (keys `tls.crt` + `tls.key`) and
  # the API server CA (`ca.crt`), mounted read-only at /tls/agent. Empty
  # keeps token-only ingest; set it AND switch apiUrl to
  # https://mist-api.<namespace>.svc.cluster.local:3001 for mTLS (the API
  # needs api.tlsSecretName too). Create with:
  # kubectl -n mist create secret generic mist-agent-tls
  #   --from-file=tls.crt=agent.crt --from-file=tls.key=agent.key
  #   --from-file=ca.crt=server-ca.crt
  clientCertSecretName: ""
  nodeSelector: {}
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi

api:
  image: mist-api:dev
  replicaCount: 1
  # Empty means in-memory storage (alerts/flows lost on restart). Set to a
  # Postgres URL for persistence; the bundled Postgres fills this in.
  databaseUrl: ""
  operatorWebhookUrl: http://mist-operator.mist.svc.cluster.local:8081/alerts
  # Auth Secret (templates/secrets.yaml). jwtSecret MUST be overridden with
  # --set for any shared environment (the chart default is dev-only);
  # adminEmail/adminPassword seed the dashboard login (empty: login fails
  # closed); ingestToken, when non-empty, is required as the Bearer token
  # on POST /api/ingest (empty: ingest stays open, dev only). ingestTokens
  # (comma-separated) accepts additional tokens for rotation/per-agent use.
  jwtSecret: "dev-only-change-me"
  adminEmail: ""
  adminPassword: ""
  ingestToken: ""
  ingestTokens: ""
  # Secret holding the API server identity (keys `tls.crt` + `tls.key`) and
  # the agent client CA (`ca.crt`), mounted read-only at /tls/api. Empty
  # keeps plain HTTP on :3000; set it to serve HTTPS on :3000 plus a
  # client-cert-gated ingest listener on :3001 (ingest leaves the main
  # port, probes switch to HTTPS, and agents need clientCertSecretName +
  # https://...:3001 apiUrl). Create with:
  # kubectl -n mist create secret generic mist-api-tls
  #   --from-file=tls.crt=server.crt --from-file=tls.key=server.key
  #   --from-file=ca.crt=client-ca.crt
  tlsSecretName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

operator:
  image: mist-operator:dev
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

postgres:
  enabled: true
  image: postgres:18-alpine
  auth:
    username: mist
    # Dev-only default. Override with --set for any shared environment.
    password: mist-dev-password
    database: mist
  persistence:
    # False keeps the current dev behavior (emptyDir, data lost on restart).
    enabled: false
    size: 10Gi
    storageClassName: ""
