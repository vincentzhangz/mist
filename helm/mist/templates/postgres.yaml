{{- /* Bundled Postgres for flow/alert history. Dev-grade by default
       (emptyDir); set postgres.persistence.enabled for a PVC. Disable
       entirely with postgres.enabled=false and point api.databaseUrl at a
       managed database instead. */ -}}
{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mist-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mist-postgres
    app.kubernetes.io/part-of: mist
spec:
  serviceName: mist-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mist-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mist-postgres
        app.kubernetes.io/part-of: mist
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mist-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mist-postgres
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      {{- if .Values.postgres.persistence.enabled }}
      volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: ["ReadWriteOnce"]
            {{- if .Values.postgres.persistence.storageClassName }}
            storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
            {{- end }}
            resources:
              requests:
                storage: {{ .Values.postgres.persistence.size | quote }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mist-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mist-postgres
    app.kubernetes.io/part-of: mist
spec:
  selector:
    app.kubernetes.io/name: mist-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
