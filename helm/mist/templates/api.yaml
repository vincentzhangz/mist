{{- /* mist-api Deployment + Service. DATABASE_URL is required for persistence;
       when postgres.enabled the bundled StatefulSet fills it in, otherwise
       set api.databaseUrl explicitly (empty = ephemeral in-memory store). */ -}}
{{- $databaseUrl := .Values.api.databaseUrl }}
{{- if and (empty $databaseUrl) .Values.postgres.enabled }}
{{- $databaseUrl = printf "postgres://$(PGUSER):$(PGPASSWORD)@mist-postgres.%s.svc.cluster.local:5432/%s" .Values.namespace .Values.postgres.auth.database }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mist-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mist-api
    app.kubernetes.io/part-of: mist
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mist-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mist-api
        app.kubernetes.io/part-of: mist
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if .Values.api.tlsSecretName }}
        # The API runs as 10001 (see docker/api.Dockerfile); the group owns
        # the mounted TLS Secret so 0440 files stay readable but not world-
        # readable. Agent DaemonSets run as root and keep 0400.
        fsGroup: 10001
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3000
            {{- if .Values.api.tlsSecretName }}
            - containerPort: 3001
            {{- end }}
          env:
            {{- if .Values.postgres.enabled }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: mist-postgres
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mist-postgres
                  key: password
            {{- end }}
            {{- if $databaseUrl }}
            - name: DATABASE_URL
              value: {{ $databaseUrl | quote }}
            {{- end }}
            - name: OPERATOR_WEBHOOK_URL
              value: {{ .Values.api.operatorWebhookUrl | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: jwt-secret
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: admin-email
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: admin-password
                  optional: true
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: ingest-token
                  optional: true
            - name: INGEST_TOKENS
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: ingest-tokens
                  optional: true
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: llm-base-url
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: llm-model
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: llm-api-key
                  optional: true
            - name: NOTIFY_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: notify-webhook-url
                  optional: true
            - name: NOTIFY_WEBHOOK_BEARER
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: notify-webhook-bearer
                  optional: true
            - name: NOTIFY_SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: notify-slack-webhook-url
                  optional: true
            - name: NOTIFY_MIN_SEVERITY
              valueFrom:
                secretKeyRef:
                  name: mist-api-auth
                  key: notify-min-severity
                  optional: true
            - name: BIND_ADDR
              value: 0.0.0.0:3000
            - name: RUST_LOG
              value: info
            {{- if .Values.api.tlsSecretName }}
            - name: TLS_CERT
              value: /tls/api/tls.crt
            - name: TLS_KEY
              value: /tls/api/tls.key
            - name: CLIENT_CA_CERT
              value: /tls/api/ca.crt
            - name: INGEST_BIND_ADDR
              value: 0.0.0.0:3001
            {{- end }}
          {{- if .Values.api.tlsSecretName }}
          volumeMounts:
            - name: api-tls
              mountPath: /tls/api
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
              {{- if .Values.api.tlsSecretName }}
              scheme: HTTPS
              {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
              {{- if .Values.api.tlsSecretName }}
              scheme: HTTPS
              {{- end }}
          resources:
            {{- .Values.api.resources | toYaml | nindent 12 }}
      {{- if .Values.api.tlsSecretName }}
      volumes:
        - name: api-tls
          secret:
            secretName: {{ .Values.api.tlsSecretName | quote }}
            defaultMode: 0440
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mist-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mist-api
    app.kubernetes.io/part-of: mist
spec:
  selector:
    app.kubernetes.io/name: mist-api
  ports:
    - port: 3000
      targetPort: 3000
      {{- if .Values.api.tlsSecretName }}
      name: main
      {{- end }}
    {{- if .Values.api.tlsSecretName }}
    - port: 3001
      targetPort: 3001
      name: ingest
    {{- end }}
