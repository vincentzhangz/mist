{{- /* mist-operator Deployment + Service (the Service fronts the alert
       webhook that mist-api calls). Probes are TCP because the operator
       exposes no HTTP health endpoint — only the /alerts webhook. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mist-operator
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mist-operator
    app.kubernetes.io/part-of: mist
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mist-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mist-operator
        app.kubernetes.io/part-of: mist
    spec:
      serviceAccountName: mist-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ .Values.operator.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          args:
            - --webhook-addr=0.0.0.0:8081
          ports:
            - containerPort: 8081
          env:
            - name: OPERATOR_NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: RUST_LOG
              value: info
          # TCP probe: the operator serves only the /alerts webhook
          # (crates/mist-operator/src/webhook.rs); there is no /healthz.
          livenessProbe:
            tcpSocket:
              port: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
          resources:
            {{- .Values.operator.resources | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mist-operator
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mist-operator
    app.kubernetes.io/part-of: mist
spec:
  selector:
    app.kubernetes.io/name: mist-operator
  ports:
    - port: 8081
      targetPort: 8081
