{{- /* Postgres credentials. The API reads them via secretKeyRef, exactly
       like deploy/postgres.yaml. Only rendered when the bundled Postgres
       is enabled; bring your own Secret otherwise. */ -}}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mist-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mist-postgres
    app.kubernetes.io/part-of: mist
type: Opaque
stringData:
  username: {{ .Values.postgres.auth.username | quote }}
  # Dev-only default. Override with --set for any shared environment.
  password: {{ .Values.postgres.auth.password | quote }}
{{- end }}
---
# API auth Secret. jwtSecret is required (the API refuses to start
# without it); the chart default is dev-only -- override with --set.
# Empty admin/ingest values render as empty keys (login fails closed,
# ingest stays open) rather than missing keys.
apiVersion: v1
kind: Secret
metadata:
  name: mist-api-auth
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mist-api-auth
    app.kubernetes.io/part-of: mist
type: Opaque
stringData:
  jwt-secret: {{ .Values.api.jwtSecret | quote }}
  admin-email: {{ .Values.api.adminEmail | quote }}
  admin-password: {{ .Values.api.adminPassword | quote }}
  ingest-token: {{ .Values.api.ingestToken | quote }}
